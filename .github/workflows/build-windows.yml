name: Build Windows release package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Secrets cannot be referenced directly from a step-level `if:` expression.
      # Inject the optional signing secret into the runner environment and decide
      # inside PowerShell whether there is anything to prepare.
      - name: Prepare optional code-signing certificate
        shell: powershell
        env:
          JSR_SIGN_PFX_BASE64: ${{ secrets.JSR_SIGN_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:JSR_SIGN_PFX_BASE64)) {
            Write-Host "No code-signing certificate configured. Building unsigned package."
            exit 0
          }

          $path = Join-Path $env:RUNNER_TEMP "jsr-code-signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:JSR_SIGN_PFX_BASE64))
          "JSR_SIGN_PFX=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Optional code-signing certificate prepared."

      - name: Read project version
        id: version
        shell: powershell
        run: |
          [xml]$pom = Get-Content .\pom.xml
          $version = [string]$pom.project.version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Could not read version from pom.xml" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Project version: $version"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $expected = "v${{ steps.version.outputs.version }}"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag ${{ github.ref_name }} does not match pom.xml version. Expected $expected"
          }

      - name: Build portable ZIP and update.json
        shell: powershell
        env:
          JSR_SIGN_PFX_PASSWORD: ${{ secrets.JSR_SIGN_PFX_PASSWORD }}
        run: |
          $notes = (git log -1 --pretty=%s).Trim()
          .\scripts\build-release-package.ps1 `
            -Repository "Yauhescha/Java-Screen-Recorder" `
            -Notes $notes

      # Every push to main produces a downloadable CI artifact containing both
      # the self-contained Windows ZIP and the update.json generated for that version.
      # This does NOT publish an update to existing users.
      - name: Upload commit build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JavaScreenRecorder-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            release-out/*.zip
            release-out/update.json
          if-no-files-found: error
          retention-days: 14

      # Public publication is intentionally tag-driven. Push v0.10.0, v0.10.1, etc.
      # The latest release contains both the ZIP and update.json, and installed copies
      # read releases/latest/download/update.json.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.version.outputs.version }}"
          $zip = Get-ChildItem ".\release-out\JavaScreenRecorder-$version-win-x64.zip" | Select-Object -First 1
          $manifest = Resolve-Path ".\release-out\update.json"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip.FullName $manifest.Path --clobber
          } else {
            gh release create $tag $zip.FullName $manifest.Path `
              --title "Java Screen Recorder $version" `
              --generate-notes `
              --latest
          }

      - name: Build summary
        if: always()
        shell: powershell
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          BUILD_REF: ${{ github.ref }}
        run: |
          "## Java Screen Recorder build" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Version: $env:BUILD_VERSION" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Ref: $env:BUILD_REF" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($env:BUILD_REF -like "refs/tags/*") {
            "- Public GitHub Release: **yes**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "- Public GitHub Release: **no** (push a matching vX.Y.Z tag to publish)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
