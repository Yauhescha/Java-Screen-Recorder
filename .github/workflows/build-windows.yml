name: Build and publish Windows release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Read version from pom.xml
        id: version
        shell: powershell
        run: |
          [xml]$pom = Get-Content .\pom.xml
          $version = [string]$pom.project.version

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not read version from pom.xml"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version: $version"

      - name: Sync AppVersion.java
        shell: powershell
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $path = ".\src\main\java\com\example\screenrecorder\AppVersion.java"

          if (-not (Test-Path $path)) {
            throw "AppVersion.java not found: $path"
          }

          $content = [System.IO.File]::ReadAllText($path)
          $content = $content.TrimStart([char]0xFEFF)

          $replacement = 'public static final String VERSION = "' + $env:BUILD_VERSION + '";'
          $updated = $content -replace 'public static final String VERSION = "[^"]+";', $replacement

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($path, $updated, $utf8NoBom)

          Write-Host "AppVersion.java synchronized to $env:BUILD_VERSION"

      - name: Prepare optional signing certificate
        shell: powershell
        env:
          JSR_SIGN_PFX_BASE64: ${{ secrets.JSR_SIGN_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:JSR_SIGN_PFX_BASE64)) {
            Write-Host "No signing certificate configured. Building unsigned release."
            exit 0
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "jsr-code-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:JSR_SIGN_PFX_BASE64)
          )

          "JSR_SIGN_PFX=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Signing certificate prepared."

      - name: Build ZIP and update.json
        shell: powershell
        env:
          JSR_SIGN_PFX_PASSWORD: ${{ secrets.JSR_SIGN_PFX_PASSWORD }}
        run: |
          $notes = (git log -1 --pretty=%s).Trim()

          .\scripts\build-release-package.ps1 `
            -Repository "${{ github.repository }}" `
            -Notes $notes

          if ($LASTEXITCODE -ne 0) {
            throw "Release package build failed."
          }

      - name: Verify release files
        shell: powershell
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = ".\release-out\JavaScreenRecorder-$env:BUILD_VERSION-win-x64.zip"
          $manifest = ".\release-out\update.json"

          if (-not (Test-Path $zip)) {
            throw "ZIP not found: $zip"
          }

          if (-not (Test-Path $manifest)) {
            throw "update.json not found: $manifest"
          }

          Write-Host "Release ZIP: $zip"
          Write-Host "Update manifest: $manifest"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v5
        with:
          name: JavaScreenRecorder-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            release-out/JavaScreenRecorder-${{ steps.version.outputs.version }}-win-x64.zip
            release-out/update.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release if this version is new