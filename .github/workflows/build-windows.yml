- name: Prepare optional code-signing certificate
  shell: powershell
  env:
    JSR_SIGN_PFX_BASE64: ${{ secrets.JSR_SIGN_PFX_BASE64 }}
  run: |
    if ([string]::IsNullOrWhiteSpace($env:JSR_SIGN_PFX_BASE64)) {
      Write-Host "No code-signing certificate configured. Building unsigned package."
      exit 0
    }
    
    $path = Join-Path $env:RUNNER_TEMP "jsr-code-signing.pfx"
    [IO.File]::WriteAllBytes(
      $path,
      [Convert]::FromBase64String($env:JSR_SIGN_PFX_BASE64)
    )
    
    "JSR_SIGN_PFX=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    Write-Host "Optional code-signing certificate prepared."

- name: Build portable ZIP and update.json
  shell: powershell
  env:
    JSR_SIGN_PFX_PASSWORD: ${{ secrets.JSR_SIGN_PFX_PASSWORD }}
  run: |
    $notes = (git log -1 --pretty=%s).Trim()
    
    .\scripts\build-release-package.ps1 `
      -Repository "Yauhescha/Java-Screen-Recorder" `
      -Notes $notes
    
    if ($LASTEXITCODE -ne 0) {
      throw "Release package build failed."
    }

- name: Verify release files
  shell: powershell
  env:
    BUILD_VERSION: ${{ steps.version.outputs.version }}
  run: |
    $zip = ".\release-out\JavaScreenRecorder-$env:BUILD_VERSION-win-x64.zip"
    $manifest = ".\release-out\update.json"
    
    if (-not (Test-Path $zip)) {
      throw "Release ZIP was not generated: $zip"
    }
    if (-not (Test-Path $manifest)) {
      throw "update.json was not generated: $manifest"
    }
    
    Write-Host "Release files verified:"
    Write-Host "  $zip"
    Write-Host "  $manifest"

# Keep every main build downloadable from Actions as well.
- name: Upload CI artifact
  uses: actions/upload-artifact@v4
  with:
    name: JavaScreenRecorder-${{ steps.version.outputs.version }}-${{ github.sha }}
    path: |
      release-out/*.zip
      release-out/update.json
    if-no-files-found: error
    retention-days: 14

# A new pom.xml version means a new public release. If vX.Y.Z is already
# published, ordinary commits with the same version do not overwrite it.
- name: Check whether this version is already released
  id: release_check
  shell: powershell
  env:
    GH_TOKEN: ${{ github.token }}
    BUILD_VERSION: ${{ steps.version.outputs.version }}
  run: |
    $tag = "v$env:BUILD_VERSION"
    
    gh release view $tag --repo "Yauhescha/Java-Screen-Recorder" *> $null
    if ($LASTEXITCODE -eq 0) {
      Write-Host "Release $tag already exists. Public release will not be overwritten."
      "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
    } else {
      Write-Host "Release $tag does not exist. It will be created from this main commit."
      "publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
    }

- name: Publish GitHub Release
  if: steps.release_check.outputs.publish == 'true'
  shell: powershell
  env:
    GH_TOKEN: ${{ github.token }}
    BUILD_VERSION: ${{ steps.version.outputs.version }}
  run: |
    $tag = "v$env:BUILD_VERSION"
    $zip = (Resolve-Path ".\release-out\JavaScreenRecorder-$env:BUILD_VERSION-win-x64.zip").Path
    $manifest = (Resolve-Path ".\release-out\update.json").Path
    $notes = (git log -1 --pretty=%s).Trim()
    
    # gh release create also creates the Git tag when it does not exist.
    gh release create $tag `
      $zip `
      $manifest `
      --repo "Yauhescha/Java-Screen-Recorder" `
      --target "${{ github.sha }}" `
      --title "Java Screen Recorder $env:BUILD_VERSION" `
      --notes $notes `
      --latest
    
    if ($LASTEXITCODE -ne 0) {
      throw "GitHub Release publication failed."
    }
    
    Write-Host "Published GitHub Release $tag"

- name: Build summary
  if: always()
  shell: powershell
  env:
    BUILD_VERSION: ${{ steps.version.outputs.version }}
    PUBLISH_RESULT: ${{ steps.release_check.outputs.publish }}
  run: |
    "## Java Screen Recorder build" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
    "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
    "- Version: $env:BUILD_VERSION" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
    "- Branch: main" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
    
    if ($env:PUBLISH_RESULT -eq "true") {
      "- GitHub Release: published automatically" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
    } elseif ($env:PUBLISH_RESULT -eq "false") {
      "- GitHub Release: already existed for this version, so it was not overwritten" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
    } else {
      "- GitHub Release: publication status unavailable because an earlier step failed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
    }
