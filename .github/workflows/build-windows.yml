name: Build Windows release package

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Prepare optional code-signing certificate
        if: ${{ secrets.JSR_SIGN_PFX_BASE64 != '' }}
        shell: powershell
        env:
          JSR_SIGN_PFX_BASE64: ${{ secrets.JSR_SIGN_PFX_BASE64 }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "jsr-code-signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:JSR_SIGN_PFX_BASE64))
          "JSR_SIGN_PFX=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Read project version
        id: version
        shell: powershell
        run: |
          [xml]$pom = Get-Content .\pom.xml
          $version = [string]$pom.project.version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Could not read version from pom.xml" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Project version: $version"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $expected = "v${{ steps.version.outputs.version }}"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag ${{ github.ref_name }} does not match pom.xml version. Expected $expected"
          }

      - name: Build portable ZIP and update.json
        shell: powershell
        env:
          JSR_SIGN_PFX_PASSWORD: ${{ secrets.JSR_SIGN_PFX_PASSWORD }}
        run: |
          $notes = (git log -1 --pretty=%s).Trim()
          .\scripts\build-release-package.ps1 `
            -Repository "Yauhescha/Java-Screen-Recorder" `
            -Notes $notes

      # This runs for every commit. It gives you a ready ZIP + update.json in Actions,
      # but does NOT publish an update to users until a version tag is pushed.
      - name: Upload commit build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JavaScreenRecorder-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            release-out/*.zip
            release-out/update.json
          if-no-files-found: error

      # A tag such as v0.10.0 is the publication switch. The same files generated above
      # become public GitHub Release assets. releases/latest/download/update.json is then
      # the stable URL used by every installed copy of the recorder.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.version.outputs.version }}"
          $zip = Get-ChildItem .\release-out\JavaScreenRecorder-$version-win-x64.zip | Select-Object -First 1
          $manifest = Resolve-Path .\release-out\update.json

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip.FullName $manifest.Path --clobber
          } else {
            gh release create $tag $zip.FullName $manifest.Path `
              --title "Java Screen Recorder $version" `
              --generate-notes `
              --latest
          }
